name = "comptaia-license"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

kv_namespaces = [
  { binding = "LICENSES", id = "a4a73e2221a14b5a97197fcc003b6e68" }
]

# ComptaIA-windows.zip, uploaded here by the build workflow on every release. The comptaia repo
# (source + GitHub Releases) stays private; this bucket is the public download path.
r2_buckets = [
  { binding = "RELEASES", bucket_name = "comptaia-releases" }
]

# Allowed origin for the confirmation page's browser call to /claim.
[vars]
ALLOWED_ORIGIN = "https://demeps.github.io"
