name = "comptaia-license"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Created by `wrangler kv namespace create LICENSES`; paste the id it prints here.
kv_namespaces = [
  { binding = "LICENSES", id = "REPLACE_WITH_KV_NAMESPACE_ID" }
]

# Allowed origin for the confirmation page's browser call to /claim.
[vars]
ALLOWED_ORIGIN = "https://comptaia.fr"
